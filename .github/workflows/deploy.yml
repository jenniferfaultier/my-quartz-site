# Name of the workflow
name: Deploy Quartz site to GitHub Pages

# Trigger this workflow on any push to the 'v4' branch
on:
  push:
    branches: ["v4"]

# Permissions needed for the workflow to build & deploy
permissions:
  contents: read       # Required to read repo contents
  pages: write         # Required to deploy to GitHub Pages
  id-token: write      # Required by GitHub Actions for Pages deployment

# Only run one deployment at a time for this repo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Build runs on a clean Ubuntu environment
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository files
      - name: Checkout repository
        uses: actions/checkout@v3  # latest stable checkout action

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3 # latest stable version
        with:
          node-version: 18          # Node 18 is LTS; you can change if needed
          cache: "npm"              # caches npm dependencies for speed

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci                 # clean install based on package-lock.json

      # Step 4: Build the Quartz site
      - name: Build Quartz site
        run: npx quartz build --directory . --output ./public
        # '--directory .' points to repo root
        # '--output ./public' puts built site into ./public folder

      # Step 5: Upload the built site to be deployed
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public           # the folder containing the built site

  deploy:
    # Deploy job runs after build job completes successfully
    environment:
      name: github-pages          # deploy environment (built-in Pages environment)
    runs-on: ubuntu-latest
    needs: build                  # ensures this runs after the build job
    steps:
      # Step 6: Deploy the site to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
        # This publishes the uploaded ./public folder to GitHub Pages
